org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS: تُبنى مكتبات klib لأهداف آبل على أي نظام (الربط النهائي يحتاج macOS في GitHub Actions)
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# iOS: جامع الذاكرة بوسم متزامن (Concurrent Mark & Sweep): لا يوقف خيط الواجهة لوسم الذاكرة كلها،
# فلا تتعلق الحركة لحظةً حين ينظّف ما تتركه صفحات المصحف وأسطرها المشكَّلة
kotlin.native.binary.gc=cms
