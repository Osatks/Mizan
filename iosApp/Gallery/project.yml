# معرض أدوات ميزان وأنشطته الحية للمراجعة البصرية على المحاكي (ios-gallery.yml)، ولا يُنشر ولا يُوقَّع.
# يُبنى من مصادر الأدوات نفسها (../MizanWidgets و ../Shared) بلا إطار Kotlin:
#   Gallery         تطبيق يرسم الأدوات وشاشة القفل بحالات حقيقية من Kotlin (Fixtures/live-fixtures.json من LiveStatesTest)
#                   ويبدأ أنشطة حية حقيقية
#   GalleryWidgets  امتداد الأدوات نفسه (حزمة الأدوات كاملة) فيرسم الأنشطة في الجزيرة الديناميكية وعلى شاشة القفل
#   GalleryUITests  يلتقط الصور
name: Gallery
options:
  bundleIdPrefix: com.mizan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    # المحاكي وحده: توقيع محلي بلا فريق
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Fixtures/live-fixtures.json
        buildPhase: resources
      - path: ../Shared
      # واجهات الأدوات لترسم في التطبيق (بلا @main حزمة الأدوات)
      - path: ../MizanWidgets
        excludes:
          - "MizanWidgets.swift"
          - "Static"
          - "Static/**"
          - "*.entitlements"
          - "Info.plist"
      - path: ../../android-app/shared/src/commonMain/assets/fonts/amiri_quran.ttf
        buildPhase: resources
    info:
      path: Gallery-Info.plist
      properties:
        CFBundleDisplayName: Gallery
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIAppFonts: [amiri_quran.ttf]
        MizanAppGroup: group.com.mizan.almuslim
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizan.gallery
        # مصادر الأدوات تجلب كتالوج رموزها (MizanWidgets/Assets.xcassets) إلى المعرض أيضاً، وليس فيه أيقونة تطبيق
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: GalleryWidgets
        embed: true

  GalleryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../MizanWidgets
        excludes:
          - "Static"
          - "Static/**"
          - "*.entitlements"
          - "Info.plist"
      - path: ../MizanWidgets/Static
        type: folder
        buildPhase: resources
      - path: ../Shared
      - path: ../../android-app/shared/src/commonMain/assets/fonts/amiri_quran.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizan.gallery.widgets
        INFOPLIST_FILE: ../MizanWidgets/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  GalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Gallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizan.gallery.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Gallery

schemes:
  Gallery:
    build:
      targets:
        Gallery: all
        GalleryUITests: [test]
    test:
      config: Debug
      targets:
        - GalleryUITests
