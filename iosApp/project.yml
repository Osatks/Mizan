# مشروع Xcode لتطبيق ميزان في iOS، يُولَّد بـ XcodeGen (xcodegen generate) فلا يُحفظ ملف .xcodeproj في المستودع.
# الواجهات والمنطق كلها في وحدة Kotlin المشتركة (android-app/shared) وتُبنى إطاراً اسمه Shared.
# أدوات الشاشة الرئيسية (MizanWidgets) امتداد WidgetKit بلغة Swift وحدها: تقرأ لقطة JSON يكتبها التطبيق
# في حاوية App Group (group.com.mizan.almuslim)، فلا تحمّل إطار Kotlin؛ وحين لا تصلها (تثبيت بحساب مجاني بلا App Group)
# تحسب المواقيت والأذكار وحدها من موقعها والبيانات المضمّنة في MizanWidgets/Static.
name: Mizan
options:
  bundleIdPrefix: com.osatks
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: ar
settings:
  base:
    MARKETING_VERSION: "2.2.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    # التوقيع: تلقائي، وفريق Apple لا يُكتب هنا بل يمرَّر عند البناء (ios-release.yml: DEVELOPMENT_TEAM=$APPLE_TEAM_ID).
    # نسخة ios.yml بلا توقيع تتجاوزه بـ CODE_SIGNING_ALLOWED=NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # تطبيق عام: iPhone و iPad (والشاشتان في iPhone Duo). الواجهة تتكيف مع مقاس النافذة (Adaptive.kt):
    # قائمة جانبية وعمودان على الشاشات الواسعة، والمصحف صفحتين متقابلتين. يُكرَّر في الهدفين لأن إعدادات XcodeGen
    # الافتراضية للهدف تغلب إعداد المشروع. iPhone بالطول، و iPad بالاتجاهات الأربعة (Info.plist).
    # الشاشة الداخلية لـ iPhone Duo بملء الشاشة تحتاج البناء بـ iOS 27.1 SDK (Xcode 27.1، المشغّل xcode-27 في سير العمل)
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Mizan:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # بديل App Group عبر سلسلة المفاتيح، مشترك مع الأداة
      - path: Shared
      # نصوص المصحف والتفاسير والأذكار والخطوط وحزم اللغات: المجلد نفسه الذي يضمّنه أندرويد
      - path: ../android-app/shared/src/commonMain/assets
        type: folder
        buildPhase: resources
      # أصوات إشعارات الأذان (أقل من 30 ثانية، caf): تُنسخ إلى جذر Mizan.app حيث يبحث عنها UNNotificationSound
      - path: Sounds
        buildPhase: resources
      # بيان الخصوصية (تطلبه مراجعة App Store): لا تتبع ولا جمع بيانات، وأسباب الواجهات المقيّدة
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizan.almuslim
        PRODUCT_NAME: Mizan
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/Mizan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../android-app/shared/build/bin/iosArm64/releaseFramework"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # الأنشطة الحية (ActivityKit، iOS 16.1) والاختصارات و Siri (AppIntents، iOS 16) غير موجودة في iOS 15:
        # ربط ضعيف حتى يعمل التطبيق هناك بدونها (LiveActivities.swift و MizanShortcuts.swift)
        OTHER_LDFLAGS: "$(inherited) -Wl,-weak_framework,ActivityKit -Wl,-weak_framework,AppIntents"
    dependencies:
      - framework: ../android-app/shared/build/bin/iosArm64/releaseFramework/Shared.framework
        embed: true
        # يوقَّع عند النسخ في نسخة المتجر (لا أثر له مع CODE_SIGNING_ALLOWED=NO في ios.yml)
        codeSign: true
      # الأدوات تُضمَّن في Mizan.app/PlugIns
      - target: MizanWidgets
        embed: true

  MizanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MizanWidgets
        excludes:
          - "Static"
          - "Static/**"
      # بيانات الحساب المستقل (المدن وجدول الهجري والأذكار وآية اليوم بكل اللغات) حين لا تصل لقطة التطبيق؛
      # تولّدها WidgetStaticTest من مصادر Kotlin، ويُقرأ المجلد كما هو من حزمة الأداة (Static/…)
      - path: MizanWidgets/Static
        type: folder
        buildPhase: resources
      - path: Shared
      # خط المصحف نفسه الذي يستعمله التطبيق (UIAppFonts في Info.plist الأداة)
      - path: ../android-app/shared/src/commonMain/assets/fonts/amiri_quran.ttf
        buildPhase: resources
      - path: Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizan.almuslim.widgets
        PRODUCT_NAME: MizanWidgets
        INFOPLIST_FILE: MizanWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: MizanWidgets/MizanWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        # AppIntents (زر «التالي» في iOS 17، وأزرار مركز التحكم في iOS 18) و ActivityKit (الأنشطة الحية في iOS 16.2)
        # غير موجودين في iOS 15: ربط ضعيف حتى تعمل الأدوات هناك
        OTHER_LDFLAGS: "$(inherited) -Wl,-weak_framework,AppIntents -Wl,-weak_framework,ActivityKit"
