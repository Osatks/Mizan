<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">Dhikr libre</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">Tasbih après la prière</button>
    </div>
    <div class="dhikr-text" id="ts-text">Subhân Allâh</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="Un tasbih">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">sur 33</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ Remettre à zéro</button>
      <button type="button" class="btn ghost sm" id="ts-undo">Annuler −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> Vibration</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">Nombre visé</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">Sans limite</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>tours complets</span></div>
      <div class="tile"><b id="ts-today">0</b><span>adhkar aujourd’hui</span></div>
      <div class="tile"><b id="ts-total">0</b><span>total</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">Journal du jour</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">Vous n’avez encore enregistré aucun dhikr aujourd’hui</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">Astuce : sur ordinateur, appuyez sur la barre d’espace ou sur Entrée pour compter.</p>
  </aside>
</div>
