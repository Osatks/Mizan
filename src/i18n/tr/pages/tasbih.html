<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">Serbest zikir</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">Namaz sonrası tesbih</button>
    </div>
    <div class="dhikr-text" id="ts-text">Sübhânallah</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="Tesbih">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">/ 33</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ Sıfırla</button>
      <button type="button" class="btn ghost sm" id="ts-undo">Geri al −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> Titreşim</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">Hedef sayı</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">Sınırsız</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>tamamlanan tur</span></div>
      <div class="tile"><b id="ts-today">0</b><span>bugünkü zikir</span></div>
      <div class="tile"><b id="ts-total">0</b><span>toplam</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">Bugünün kaydı</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">Bugün henüz zikir kaydetmediniz</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">İpucu: bilgisayarda saymak için boşluk tuşuna veya Enter'a basın.</p>
  </aside>
</div>
