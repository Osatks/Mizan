<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">Freier Dhikr</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">Tasbih nach dem Gebet</button>
    </div>
    <div class="dhikr-text" id="ts-text">Subhan Allah</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="Tasbih zählen">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">von 33</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ Zurücksetzen</button>
      <button type="button" class="btn ghost sm" id="ts-undo">Rückgängig −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> Vibration</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">Zielzahl</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">Unbegrenzt</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>abgeschlossene Runden</span></div>
      <div class="tile"><b id="ts-today">0</b><span>Dhikr heute</span></div>
      <div class="tile"><b id="ts-total">0</b><span>Gesamt</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">Heutiges Protokoll</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">Du hast heute noch keine Adhkar erfasst</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">Tipp: Am Computer drückst du zum Zählen die Leertaste oder Enter.</p>
  </aside>
</div>
