<div class="tool-layout" id="hijri-app">
  <section class="card">
    <div class="tool-head">
      <h2>Datum umrechnen</h2>
      <div class="segmented" role="tablist" id="hj-dir">
        <button type="button" role="tab" data-dir="g2h" aria-selected="true">Gregorianisch → Hidschri</button>
        <button type="button" role="tab" data-dir="h2g" aria-selected="false">Hidschri → Gregorianisch</button>
      </div>
    </div>

    <div id="hj-g2h">
      <div class="form-grid">
        <div class="field"><label for="g-day">Tag</label><select id="g-day"></select></div>
        <div class="field"><label for="g-month">Monat</label><select id="g-month"></select></div>
        <div class="field"><label for="g-year">Jahr</label><input id="g-year" type="number" min="623" max="2100" inputmode="numeric"></div>
      </div>
    </div>
    <div id="hj-h2g" hidden>
      <div class="form-grid">
        <div class="field"><label for="h-day">Tag</label><select id="h-day"></select></div>
        <div class="field"><label for="h-month">Monat</label><select id="h-month"></select></div>
        <div class="field"><label for="h-year">Jahr</label><input id="h-year" type="number" min="1" max="1500" inputmode="numeric"></div>
      </div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn ghost sm" id="hj-today">Heutiges Datum</button>
      <button type="button" class="btn ghost sm" id="hj-copy">Ergebnis kopieren</button>
    </div>

    <div class="conv-result" aria-live="polite">
      <div class="label" id="hj-res-label">Entsprechendes Hidschri-Datum</div>
      <div class="big-number" id="hj-res">—</div>
      <div id="hj-res-sub" class="muted"></div>
    </div>
  </section>

  <aside class="card">
    <div class="cal-nav">
      <button type="button" class="icon-btn" id="cal-prev" aria-label="Vorheriger Monat">←</button>
      <h3 id="cal-title"></h3>
      <button type="button" class="icon-btn" id="cal-next" aria-label="Nächster Monat">→</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <p class="muted" style="font-size:.85rem;margin:12px 0 0">Die große Zahl ist der Hidschri-Tag, die kleine der gregorianische Tag. Tippe auf einen Tag, um ihn umzurechnen.</p>
  </aside>
</div>
