<!--META
{"title": "Altersrechner nach Hidschri- und gregorianischem Kalender (Jahre, Monate, Tage)", "h1": "Altersrechner", "description": "Berechne dein Alter nach Hidschri- und gregorianischem Kalender in Jahren, Monaten und Tagen, erfahre den Wochentag deiner Geburt, dein Hidschri-Geburtsdatum, die Zahl der gelebten Tage und die verbleibende Zeit bis zum nächsten Geburtstag.", "path": "/age-calculator/", "type": "tool", "nav": "age", "breadcrumb": "Altersrechner", "lead": "Gib dein Geburtsdatum nach Hidschri- oder gregorianischem Kalender ein und erfahre dein genaues Alter in beiden Kalendern sowie interessante Statistiken über dein Leben.", "date": "2026-10-15", "scripts": ["age.js"]}
-->
<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>Geburtsdatum</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">Gregorianisch</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">Hidschri</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">Tag</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">Monat</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">Jahr</label><input id="age-y" type="number" inputmode="numeric" placeholder="z. B. 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">Alter berechnen zum Datum (gregorianisch)</label>
      <input id="age-at" type="date">
      <span class="hint">Lass das heutige Datum stehen oder ändere es, um dein Alter an einem bestimmten Datum zu erfahren.</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">Statistiken über dein Alter</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">Dein Alter nach gregorianischem Kalender</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">Dein Alter nach Hidschri-Kalender</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">Teilen</button></div>
  </aside>
</div>

<!--INCLUDE content/age.html-->
