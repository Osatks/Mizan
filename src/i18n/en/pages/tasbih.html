<!--META
{"title": "Digital Tasbih: Glorify and Remember Allah with a Counter that Saves Your Progress", "h1": "Digital Tasbih", "description": "A free digital tasbih for mobile and desktop: a tasbih counter that saves your progress, ready-made adhkar, an after-prayer tasbih mode of 33-33-34, and vibration when the count is complete.", "path": "/tasbih/", "type": "tool", "nav": "tasbih", "breadcrumb": "Digital Tasbih", "lead": "Tap the circle or press the space bar to count. Your count is saved automatically on your device.", "date": "2026-10-15", "scripts": ["tasbih.js"]}
-->
<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">Free dhikr</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">After-prayer tasbih</button>
    </div>
    <div class="dhikr-text" id="ts-text">سُبْحَانَ اللَّهِ</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="Count one tasbih">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">of 33</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ Reset</button>
      <button type="button" class="btn ghost sm" id="ts-undo">Undo −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> Vibration</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">Target count</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">No limit</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>completed rounds</span></div>
      <div class="tile"><b id="ts-today">0</b><span>dhikr today</span></div>
      <div class="tile"><b id="ts-total">0</b><span>total</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">Today's log</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">You have not recorded any adhkar today yet</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">Tip: on a computer, press the space bar or Enter to count.</p>
  </aside>
</div>
