<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>জন্মতারিখ</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">খ্রিস্টীয়</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">হিজরি</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">দিন</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">মাস</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">বছর</label><input id="age-y" type="number" inputmode="numeric" placeholder="উদাহরণ: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">যে তারিখে বয়স হিসাব করবেন (খ্রিস্টীয়)</label>
      <input id="age-at" type="date">
      <span class="hint">আজকের তারিখেই রেখে দিন, অথবা নির্দিষ্ট কোনো তারিখে আপনার বয়স জানতে এটি পরিবর্তন করুন।</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">আপনার বয়স সম্পর্কে পরিসংখ্যান</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">খ্রিস্টীয় ক্যালেন্ডারে আপনার বয়স</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">হিজরি ক্যালেন্ডারে আপনার বয়স</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">শেয়ার করুন</button></div>
  </aside>
</div>
