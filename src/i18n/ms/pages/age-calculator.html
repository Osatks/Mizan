<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>Tarikh lahir</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">Masihi</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">Hijrah</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">Hari</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">Bulan</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">Tahun</label><input id="age-y" type="number" inputmode="numeric" placeholder="Contoh: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">Kira umur pada tarikh (Masihi)</label>
      <input id="age-at" type="date">
      <span class="hint">Biarkan pada tarikh hari ini, atau ubahnya untuk mengetahui umur anda pada tarikh tertentu.</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">Statistik tentang umur anda</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">Umur anda mengikut kalendar Masihi</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">Umur anda mengikut kalendar Hijrah</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">Kongsi</button></div>
  </aside>
</div>
