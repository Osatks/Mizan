<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>تاریخِ پیدائش</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">عیسوی</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">ہجری</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">دن</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">مہینہ</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">سال</label><input id="age-y" type="number" inputmode="numeric" placeholder="مثال: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">اس تاریخ پر عمر کا حساب (عیسوی)</label>
      <input id="age-at" type="date">
      <span class="hint">اسے آج کی تاریخ پر رہنے دیں، یا کسی مخصوص تاریخ پر اپنی عمر جاننے کے لیے بدل دیں۔</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">آپ کی عمر کے اعداد و شمار</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">عیسوی کیلنڈر کے مطابق آپ کی عمر</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">ہجری کیلنڈر کے مطابق آپ کی عمر</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">شیئر کریں</button></div>
  </aside>
</div>
