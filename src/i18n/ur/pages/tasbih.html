<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">آزاد ذکر</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">نماز کے بعد کی تسبیح</button>
    </div>
    <div class="dhikr-text" id="ts-text">سُبْحَانَ اللَّهِ</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="تسبیح">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">33 میں سے</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ صفر کریں</button>
      <button type="button" class="btn ghost sm" id="ts-undo">واپس −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> وائبریشن</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">مطلوبہ تعداد</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">بلا حد</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>مکمل دور</span></div>
      <div class="tile"><b id="ts-today">0</b><span>آج کا ذکر</span></div>
      <div class="tile"><b id="ts-total">0</b><span>کل</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">آج کا ریکارڈ</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">آپ نے آج ابھی تک کوئی ذکر درج نہیں کیا</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">مشورہ: کمپیوٹر پر گنتی کے لیے اسپیس بار یا Enter دبائیں۔</p>
  </aside>
</div>
