<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>تاریخ تولد</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">میلادی</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">هجری قمری</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">روز</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">ماه</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">سال</label><input id="age-y" type="number" inputmode="numeric" placeholder="مثال: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">محاسبه سن در تاریخ (میلادی)</label>
      <input id="age-at" type="date">
      <span class="hint">آن را روی تاریخ امروز بگذارید، یا برای دانستن سن خود در تاریخی معین تغییرش دهید.</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">آمارهایی درباره سن شما</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">سن شما در تقویم میلادی</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">سن شما در تقویم هجری قمری</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">اشتراک‌گذاری</button></div>
  </aside>
</div>
