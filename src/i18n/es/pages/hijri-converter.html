<!--META
{"title": "Conversor de fechas hiyri y gregoriana según el calendario Umm al-Qura", "h1": "Conversor de fecha hiyri", "description": "Convierte al instante fechas del calendario hiyri al gregoriano y del gregoriano al hiyri según el calendario Umm al-Qura, con un calendario mensual doble que muestra ambas fechas y el día de hoy.", "path": "/hijri-converter/", "type": "tool", "nav": "hijri", "breadcrumb": "Fecha hiyri", "lead": "Conversión instantánea y precisa entre ambas fechas, con un calendario mensual que muestra la fecha hiyri y la gregoriana una junto a otra.", "date": "2026-10-15", "scripts": ["hijri.js"]}
-->
<div class="tool-layout" id="hijri-app">
  <section class="card">
    <div class="tool-head">
      <h2>Convertir fecha</h2>
      <div class="segmented" role="tablist" id="hj-dir">
        <button type="button" role="tab" data-dir="g2h" aria-selected="true">Gregoriana → Hiyri</button>
        <button type="button" role="tab" data-dir="h2g" aria-selected="false">Hiyri → Gregoriana</button>
      </div>
    </div>

    <div id="hj-g2h">
      <div class="form-grid">
        <div class="field"><label for="g-day">Día</label><select id="g-day"></select></div>
        <div class="field"><label for="g-month">Mes</label><select id="g-month"></select></div>
        <div class="field"><label for="g-year">Año</label><input id="g-year" type="number" min="623" max="2100" inputmode="numeric"></div>
      </div>
    </div>
    <div id="hj-h2g" hidden>
      <div class="form-grid">
        <div class="field"><label for="h-day">Día</label><select id="h-day"></select></div>
        <div class="field"><label for="h-month">Mes</label><select id="h-month"></select></div>
        <div class="field"><label for="h-year">Año</label><input id="h-year" type="number" min="1" max="1500" inputmode="numeric"></div>
      </div>
    </div>
    <div class="btn-row">
      <button type="button" class="btn ghost sm" id="hj-today">Fecha de hoy</button>
      <button type="button" class="btn ghost sm" id="hj-copy">Copiar resultado</button>
    </div>

    <div class="conv-result" aria-live="polite">
      <div class="label" id="hj-res-label">Fecha hiyri equivalente</div>
      <div class="big-number" id="hj-res">—</div>
      <div id="hj-res-sub" class="muted"></div>
    </div>
  </section>

  <aside class="card">
    <div class="cal-nav">
      <button type="button" class="icon-btn" id="cal-prev" aria-label="Mes anterior">←</button>
      <h3 id="cal-title"></h3>
      <button type="button" class="icon-btn" id="cal-next" aria-label="Mes siguiente">→</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <p class="muted" style="font-size:.85rem;margin:12px 0 0">El número grande es el día hiyri y el pequeño, el día gregoriano. Pulsa cualquier día para convertirlo.</p>
  </aside>
</div>
