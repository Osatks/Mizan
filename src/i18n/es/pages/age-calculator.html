<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>Fecha de nacimiento</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">Gregoriana</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">Hiyri</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">Día</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">Mes</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">Año</label><input id="age-y" type="number" inputmode="numeric" placeholder="Ejemplo: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">Calcular la edad en la fecha (gregoriana)</label>
      <input id="age-at" type="date">
      <span class="hint">Déjala en la fecha de hoy o cámbiala para saber tu edad en una fecha concreta.</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">Datos sobre tu edad</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">Tu edad según el calendario gregoriano</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">Tu edad según el calendario hiyri</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">Compartir</button></div>
  </aside>
</div>
