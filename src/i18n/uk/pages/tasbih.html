<div class="tool-layout" id="tasbih-app">
  <section class="card tasbih-zone">
    <div class="segmented" role="tablist" id="ts-mode" style="margin-bottom:18px">
      <button type="button" role="tab" data-mode="free" aria-selected="true">Вільний зікр</button>
      <button type="button" role="tab" data-mode="salah" aria-selected="false">Тасбіх після намазу</button>
    </div>
    <div class="dhikr-text" id="ts-text">سُبْحَانَ اللَّهِ</div>
    <button type="button" class="tasbih-btn" id="ts-btn" aria-label="Тасбіх">
      <svg class="tasbih-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="47"/><circle class="fill" id="ts-ring" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg>
      <span><span class="count" id="ts-count">0</span><span class="of" id="ts-of">з 33</span></span>
    </button>
    <div class="dhikr-chips" id="ts-chips"></div>
    <div class="btn-row" style="justify-content:center">
      <button type="button" class="btn ghost sm" id="ts-reset">↺ Скинути</button>
      <button type="button" class="btn ghost sm" id="ts-undo">Скасувати −1</button>
      <label class="check" style="padding:6px 12px"><input type="checkbox" id="ts-vibe" checked> Вібрація</label>
    </div>
  </section>

  <aside class="card result-card">
    <div class="field">
      <label for="ts-target">Цільова кількість</label>
      <select id="ts-target"><option value="33">33</option><option value="34">34</option><option value="100">100</option><option value="1000">1000</option><option value="0">Без обмеження</option></select>
    </div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile"><b id="ts-rounds">0</b><span>завершених кіл</span></div>
      <div class="tile"><b id="ts-today">0</b><span>зікрів сьогодні</span></div>
      <div class="tile"><b id="ts-total">0</b><span>усього</span></div>
    </div>
    <h3 class="group-title" style="margin-top:20px">Журнал за сьогодні</h3>
    <ul class="stat-list" id="ts-log"><li><span class="muted">Сьогодні ви ще не записали жодного зікру</span></li></ul>
    <p class="muted" style="font-size:.85rem;margin:14px 0 0">Порада: на комп’ютері натискайте пробіл або Enter для ліку.</p>
  </aside>
</div>
