<div class="tool-layout" id="age-app">
  <section class="card">
    <div class="tool-head">
      <h2>تاريخ الميلاد</h2>
      <div class="segmented" role="tablist" id="age-cal">
        <button type="button" role="tab" data-cal="g" aria-selected="true">ميلادي</button>
        <button type="button" role="tab" data-cal="h" aria-selected="false">هجري</button>
      </div>
    </div>
    <div class="form-grid">
      <div class="field"><label for="age-d">اليوم</label><select id="age-d"></select></div>
      <div class="field"><label for="age-m">الشهر</label><select id="age-m"></select></div>
      <div class="field"><label for="age-y">السنة</label><input id="age-y" type="number" inputmode="numeric" placeholder="مثال: 1995"></div>
    </div>
    <div class="field" style="margin-top:16px">
      <label for="age-at">حساب العمر في تاريخ (ميلادي)</label>
      <input id="age-at" type="date">
      <span class="hint">اتركه على تاريخ اليوم، أو غيّره لمعرفة عمرك في تاريخ معين.</span>
    </div>

    <div id="age-extra" hidden>
      <h3 class="group-title" style="margin-top:24px">إحصاءات عن عمرك</h3>
      <div class="tiles" id="age-tiles"></div>
    </div>
  </section>

  <aside class="card result-card" aria-live="polite">
    <div class="result-head">
      <div class="label">عمرك بالتقويم الميلادي</div>
      <div class="big-number" id="age-g">—</div>
    </div>
    <div class="result-head">
      <div class="label">عمرك بالتقويم الهجري</div>
      <div class="big-number" id="age-h" style="color:var(--gold)">—</div>
    </div>
    <ul class="stat-list" id="age-list"></ul>
    <div class="btn-row"><button type="button" class="btn" id="age-share">مشاركة</button></div>
  </aside>
</div>
