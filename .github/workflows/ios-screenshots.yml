name: iOS Screenshots (App Store)

# لقطات المتجر من المحاكي لتطبيق عام (iosApp/fastlane/screenshots.sh):
#   iPhone بشاشة 6.9 بوصة (1320×2868)، و iPad Pro 13 بوصة (2064×2752) ومعها لقطة المصحف بالعرض صفحتين متقابلتين،
#   و iPhone Duo من محاكي iOS 27.1 (تُرفع إن عرف deliver مقاسها، وإلا تبقى في الملف المرفق وحده).
# يفتح كل شاشة بروابط mizan://open?route=… ويلتقطها لكل لغة. النتيجة في iosApp/fastlane/screenshots/<locale>/
# ملفاً مرفقاً (artifact)، وتُضاف إلى الفرع إن اخترت commit، فيرفعها ios-release.yml (submit=true) مع النصوص.
# الأدوات (Widgets) لا تُلتقط هنا.
#
# على مرحلتين: إطار Kotlin للمحاكي على macos-15 بـ Xcode 16 (Kotlin 2.1.21 مختبَر حتى Xcode 16.x)، ثم التطبيق
# واللقطات على xcode-27 بـ Xcode 27.1 (محاكيات iOS 27 و iPhone Duo بنظام 27.1).
on:
  workflow_dispatch:
    inputs:
      locales:
        description: "App Store locales (space separated)"
        type: string
        default: "ar-SA en-US"
      devices:
        description: "Simulators (space separated: iphone ipad duo watch)"
        type: string
        default: "iphone ipad duo watch"
      commit:
        description: "Commit the screenshots to this branch (iosApp/fastlane/screenshots)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # لقطات الساعة: حالات Kotlin الحقيقية (LiveStatesTest) تُمرَّر إليها كما يرسلها iPhone
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Kotlin states for the watch screenshots
        working-directory: android-app
        run: gradle :shared:testDebugUnitTest --tests '*LiveStatesTest*' --no-daemon
        env:
          MIZAN_GALLERY_EXPORT: ${{ runner.temp }}/fixtures

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-fixtures
          path: ${{ runner.temp }}/fixtures/live-fixtures.json
          if-no-files-found: error
          retention-days: 3

  framework:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Kotlin framework (iosSimulatorArm64)
        working-directory: android-app
        run: |
          x16=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' 2>/dev/null | sort -V | tail -n1)
          if [ -n "$x16" ]; then export DEVELOPER_DIR="$x16/Contents/Developer"; echo "Kotlin link with $x16"; fi
          xcodebuild -version
          gradle :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --stacktrace

      - name: Pack framework
        run: tar -czf "$RUNNER_TEMP/shared-framework-sim.tgz" -C android-app/shared/build/bin/iosSimulatorArm64/releaseFramework Shared.framework

      - uses: actions/upload-artifact@v4
        with:
          name: shared-framework-simulator
          path: ${{ runner.temp }}/shared-framework-sim.tgz
          if-no-files-found: error
          retention-days: 3

  screenshots:
    needs: [framework, fixtures]
    # صورة Xcode 27 (معاينة arm64): Xcode 27.1 افتراضي، ومحاكي iPhone Duo بنظام iOS 27.1
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 27.1
        run: |
          x=/Applications/Xcode_27.1.app/Contents/Developer
          if [ -d "$x" ]; then export DEVELOPER_DIR="$x"; echo "DEVELOPER_DIR=$x" >> "$GITHUB_ENV"; fi
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -E "iPhone (17|18) Pro Max|iPad Pro 13|iPhone Duo" || true

      - uses: actions/download-artifact@v4
        with:
          name: shared-framework-simulator
          path: ${{ runner.temp }}

      # project.yml يربط الإطار من مسار iosArm64: نضع نسخة المحاكي مكانه في هذا البناء وحده
      - name: Use the simulator framework
        run: |
          dst=android-app/shared/build/bin/iosArm64/releaseFramework
          rm -rf "$dst" && mkdir -p "$dst"
          tar -xzf "$RUNNER_TEMP/shared-framework-sim.tgz" -C "$dst"
          test -f "$dst/Shared.framework/Shared"

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (simulator)
        working-directory: iosApp
        run: |
          set -o pipefail
          # بلا -sdk: تطبيق الساعة المضمَّن يُبنى لمحاكي watchOS والتطبيق لمحاكي iOS
          xcodebuild -project Mizan.xcodeproj -scheme Mizan -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 60
          APP=build/Build/Products/Release-iphonesimulator/Mizan.app
          test -d "$APP"
          # توقيع محلي (ad-hoc) يحمل صلاحية App Group كما في ios.yml، يكفي للمحاكي
          for f in "$APP"/Frameworks/*.framework; do [ -d "$f" ] && codesign --force --sign - --timestamp=none "$f"; done
          codesign --force --sign - --timestamp=none --entitlements MizanWidgets/MizanWidgets.entitlements "$APP/PlugIns/MizanWidgets.appex"
          # تطبيق الساعة ومضاعفاتها قبل التطبيق (لا يُختم تطبيق فيه ما لم يوقَّع)
          for x in "$APP"/Watch/*.app/PlugIns/*.appex; do [ -d "$x" ] && codesign --force --sign - --timestamp=none --entitlements MizanWatchWidgets/MizanWatchWidgets.entitlements "$x"; done
          for x in "$APP"/Watch/*.app; do [ -d "$x" ] && codesign --force --sign - --timestamp=none --entitlements MizanWatch/MizanWatch.entitlements "$x"; done
          codesign --force --sign - --timestamp=none --entitlements iosApp/Mizan.entitlements "$APP"

      - uses: actions/download-artifact@v4
        with:
          name: screenshot-fixtures
          path: ${{ runner.temp }}/fixtures

      - name: Capture screenshots
        working-directory: iosApp
        run: |
          chmod +x fastlane/screenshots.sh
          fastlane/screenshots.sh "$PWD/build/Build/Products/Release-iphonesimulator/Mizan.app" "$PWD/fastlane/screenshots" "$LOCALES" "$DEVICES"
        env:
          LOCALES: ${{ inputs.locales }}
          DEVICES: ${{ inputs.devices }}
          FIXTURES: ${{ runner.temp }}/fixtures/live-fixtures.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iosApp

      # كل لقطة يرفعها deliver يجب أن يعرف مقاسها (fastlane المثبَّت في Gemfile.lock)؛ ما لا يعرفه (لقطات Duo مثلاً)
      # يُنقل إلى screenshots-extra ويبقى في الملف المرفق وحده، فلا يُلغي رفع اللقطات الأخرى
      - name: Check display types (fastlane deliver)
        working-directory: iosApp
        run: |
          req=""
          if [[ " $DEVICES " == *" iphone "* && " $DEVICES " == *" ipad "* ]]; then req="--require-ipad"; fi
          bundle exec ruby fastlane/check_screenshots.rb fastlane/screenshots --move-unknown fastlane/screenshots-extra $req
        env:
          DEVICES: ${{ inputs.devices }}

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-app-store-screenshots
          path: |
            iosApp/fastlane/screenshots
            iosApp/fastlane/screenshots-extra
            iosApp/fastlane/screenshot-logs
          if-no-files-found: error

      - name: Commit screenshots
        if: ${{ inputs.commit }}
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iosApp/fastlane/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "لقطات App Store من المحاكي ($LOCALES): iPhone و iPad و iPhone Duo"
          # قد يُدفع إلى الفرع شيء أثناء الالتقاط (ساعة تقريباً): تُضاف اللقطات فوقه
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
