name: iOS Release (App Store)

# نسخة المتجر: تُبنى وتوقَّع تلقائياً بمفتاح App Store Connect API ثم تُرفع مباشرة إلى App Store Connect (TestFlight).
# مع submit=true: تُرفع نصوص المتجر ولقطاته من iosApp/fastlane وتُرسل النسخة للمراجعة، وتُنشر تلقائياً بعد القبول.
# نسخة التثبيت الجانبي بلا توقيع باقية في ios.yml. الخطوات كاملة في iosApp/APP_STORE.md.
#
# الأسرار (Settings ← Secrets and variables ← Actions):
#   ASC_KEY_ID      معرّف المفتاح (Key ID)
#   ASC_ISSUER_ID   Issuer ID من صفحة المفاتيح نفسها
#   ASC_KEY_P8      ملف AuthKey_XXXX.p8 بترميز base64
#   APPLE_TEAM_ID   Team ID من صفحة Membership (10 أحرف)
#   اختيارية لبيانات التواصل مع المراجِع: REVIEW_FIRST_NAME و REVIEW_LAST_NAME و REVIEW_PHONE و REVIEW_EMAIL
on:
  # يدوي فقط: دقائق macOS في GitHub Actions تُحسب بعشرة أضعاف
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit this build for App Review (upload metadata + screenshots, automatic release after approval)"
        type: boolean
        default: false
      metadata_only:
        description: "Only upload metadata + screenshots for this version (no build, no submission)"
        type: boolean
        default: false

# لا يُرفع بناءان معاً (رقم البناء نفسه يُرفض في المرة الثانية)
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    # Xcode 26 / iOS 26 SDK: شرط App Store Connect لكل رفع منذ 28 أبريل 2026
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for k in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets (Settings → Secrets and variables → Actions):$missing. See iosApp/APP_STORE.md."
            exit 1
          fi
          if ! printf '%s' "$APPLE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "::error title=APPLE_TEAM_ID::APPLE_TEAM_ID must be the 10-character Team ID from developer.apple.com → Membership details"
            exit 1
          fi
          if ! printf '%s' "$ASC_KEY_P8" | base64 --decode 2>/dev/null | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error title=ASC_KEY_P8::ASC_KEY_P8 must be the base64 of the whole AuthKey_XXXX.p8 file (see APP_STORE.md for the PowerShell one-liner)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # رقم البناء = عدد الـ commits، ويجب أن يزيد في كل رفع

      - name: Version
        id: v
        run: |
          n=$(git rev-list --count HEAD)
          echo "build=$n" >> "$GITHUB_OUTPUT"
          echo "name=2.2.$(( n > 53 ? n - 53 : 1 ))" >> "$GITHUB_OUTPUT"
          echo "Version 2.2.$(( n > 53 ? n - 53 : 1 )) ($n)" >> "$GITHUB_STEP_SUMMARY"

      - name: Xcode
        if: ${{ !inputs.metadata_only }}
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -n1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::App Store Connect needs Xcode 26+ (found $major). Select a newer Xcode on this runner image."
            exit 1
          fi

      - uses: actions/setup-java@v5
        if: ${{ !inputs.metadata_only }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !inputs.metadata_only }}
        with:
          gradle-version: "8.14.3"

      - name: Shared unit tests
        if: ${{ !inputs.metadata_only }}
        working-directory: android-app
        run: gradle :shared:testDebugUnitTest --no-daemon

      # Kotlin 2.1.21 مختبَر حتى Xcode 16.x: إن وُجد Xcode 16 على المشغّل يُربط به إطار Kotlin وحده،
      # ويبقى التطبيق نفسه على Xcode 26 (شرط المتجر يخص SDK التطبيق). وإلا فبالافتراضي.
      - name: Build Kotlin framework (iosArm64)
        if: ${{ !inputs.metadata_only }}
        working-directory: android-app
        run: |
          x16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$x16" ]; then export DEVELOPER_DIR="$x16/Contents/Developer"; echo "Kotlin link with $x16"; fi
          gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      # إطار Kotlin ملف تنفيذي مستقل داخل التطبيق: بيان خصوصيته معه (stat/fstat و mach_absolute_time من Kotlin/Native و Skia)
      - name: Privacy manifest for Shared.framework
        if: ${{ !inputs.metadata_only }}
        run: |
          cp iosApp/Privacy/Shared/PrivacyInfo.xcprivacy android-app/shared/build/bin/iosArm64/releaseFramework/Shared.framework/
          plutil -lint android-app/shared/build/bin/iosArm64/releaseFramework/Shared.framework/PrivacyInfo.xcprivacy

      - name: Generate Xcode project
        if: ${{ !inputs.metadata_only }}
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: App Store Connect API key
        if: ${{ !inputs.metadata_only }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # التوقيع التلقائي: Xcode ينشئ الشهادة وملفات التوقيع (للتطبيق والأداة مع App Group) بالمفتاح نفسه.
      # يحتاج المفتاح دور Admin، وجهازاً واحداً مسجلاً في الحساب (ملف التطوير لا يُنشأ بلا جهاز) — اقرأ APP_STORE.md
      - name: Archive (signed)
        if: ${{ !inputs.metadata_only }}
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild -project Mizan.xcodeproj -scheme Mizan -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Mizan.xcarchive" \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.v.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.v.outputs.build }} \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision)|\*\* ARCHIVE" || true
          APP="$RUNNER_TEMP/Mizan.xcarchive/Products/Applications/Mizan.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Archive failed — last lines of the log:"
            tail -n 120 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          test -d "$APP/PlugIns/MizanWidgets.appex"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/PlugIns/MizanWidgets.appex/PrivacyInfo.xcprivacy"
          test -f "$APP/Frameworks/Shared.framework/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :UIDeviceFamily" "$APP/Info.plist"
          codesign -d --entitlements - "$APP" 2>&1 | tail -n 15
          codesign -d --entitlements - "$APP/PlugIns/MizanWidgets.appex" 2>&1 | tail -n 15

      - name: Export and upload to App Store Connect
        if: ${{ !inputs.metadata_only }}
        working-directory: iosApp
        run: |
          set -o pipefail
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Mizan.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 60
          grep -qE "Upload succeeded|Uploaded Mizan|EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log" || { echo "::error::Upload to App Store Connect failed (see log above)"; exit 1; }
          echo "Uploaded build ${{ steps.v.outputs.build }} — it appears in App Store Connect → TestFlight after processing (5–30 min)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep dSYMs and logs
        if: ${{ always() && !inputs.metadata_only }}
        uses: actions/upload-artifact@v4
        with:
          name: mizan-ios-release-${{ steps.v.outputs.build }}
          path: |
            ${{ runner.temp }}/Mizan.xcarchive/dSYMs
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Check App Store metadata limits
        if: ${{ inputs.submit || inputs.metadata_only }}
        run: python3 iosApp/fastlane/check_metadata.py

      - uses: ruby/setup-ruby@v1
        if: ${{ inputs.submit || inputs.metadata_only }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: iosApp

      # النصوص (iosApp/fastlane/metadata) واللقطات (iosApp/fastlane/screenshots، من ios-screenshots.yml)،
      # ثم انتظار معالجة البناء واختياره للنسخة وإرسالها للمراجعة مع النشر التلقائي بعد القبول
      - name: App Store metadata and submission (fastlane deliver)
        if: ${{ inputs.submit || inputs.metadata_only }}
        working-directory: iosApp
        env:
          MIZAN_VERSION: ${{ steps.v.outputs.name }}
          MIZAN_BUILD: ${{ steps.v.outputs.build }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_DISABLE_COLORS: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.metadata_only }}" != "true" ]; then
            bundle exec fastlane ios submit
            echo "Submitted ${{ steps.v.outputs.name }} (${{ steps.v.outputs.build }}) for review — automatic release after approval" >> "$GITHUB_STEP_SUMMARY"
          else
            bundle exec fastlane ios metadata
            echo "Metadata uploaded for ${{ steps.v.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
