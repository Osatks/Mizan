name: Android App

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK مثبّت مسبقاً على أجهزة GitHub (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # مفتاح التوقيع (اختياري): يُضاف من إعدادات المستودع ← Secrets
      - name: Prepare signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MIZAN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        env:
          MIZAN_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MIZAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MIZAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-android
          path: |
            android-app/app/build/outputs/apk/**/*.apk
            android-app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
