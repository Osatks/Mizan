name: iOS App

# نسخة تطوير لـ iOS: تُبنى على macOS بلا توقيع (ملف .ipa)، ويوقّعها المستخدم بحسابه عند التثبيت
# (Sideloadly أو AltStore بحساب Apple مجاني). الواجهات والمنطق من وحدة Kotlin المشتركة مع أندرويد.
on:
  # يدوي فقط (Actions ← Run workflow): دقائق GitHub Actions محدودة، وبناء macOS يُحسب بعشرة أضعاف
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # رقم الإصدار = عدد الـ commits (كما في أندرويد)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Version
        id: v
        run: |
          n=$(git rev-list --count HEAD)
          echo "build=$n" >> "$GITHUB_OUTPUT"
          echo "name=2.2.$(( n > 53 ? n - 53 : 1 ))" >> "$GITHUB_OUTPUT"

      # اختبارات الكود المشترك (JVM) قبل البناء
      - name: Shared unit tests
        working-directory: android-app
        run: gradle :shared:testDebugUnitTest --no-daemon

      - name: Build Kotlin framework (iosArm64)
        working-directory: android-app
        run: gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (unsigned)
        working-directory: iosApp
        run: |
          xcodebuild -project Mizan.xcodeproj -scheme Mizan -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ steps.v.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.v.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80
          test -d build/Build/Products/Release-iphoneos/Mizan.app
          # أدوات الشاشة الرئيسية يجب أن تكون داخل التطبيق
          test -d build/Build/Products/Release-iphoneos/Mizan.app/PlugIns/MizanWidgets.appex

      # البناء بلا توقيع لا يضع الصلاحيات (entitlements) في الملف التنفيذي، و AltStore/Sideloadly تقرأ منه
      # صلاحية App Group لتسجّلها للتطبيق والأداة عند التوقيع بحساب Apple. فنضع توقيعاً مؤقتاً (ad-hoc، بلا شهادة)
      # يحمل الصلاحيات؛ يُستبدل عند التثبيت. إن تعذّر يبقى الملف صالحاً لكن الأدوات لن ترى بيانات التطبيق.
      - name: Embed entitlements (ad-hoc signature)
        working-directory: iosApp
        run: |
          APP=build/Build/Products/Release-iphoneos/Mizan.app
          sign() { codesign --force --sign - --timestamp=none "$@" || echo "::warning::codesign failed for ${@: -1}"; }
          for f in "$APP"/Frameworks/*.framework; do [ -d "$f" ] && sign "$f"; done
          sign --entitlements MizanWidgets/MizanWidgets.entitlements "$APP/PlugIns/MizanWidgets.appex"
          sign --entitlements iosApp/Mizan.entitlements "$APP"
          codesign -d --entitlements - "$APP/PlugIns/MizanWidgets.appex" 2>&1 | tail -n 12 || true
          codesign -d --entitlements - "$APP" 2>&1 | tail -n 12 || true

      - name: Package .ipa
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Mizan.app Payload/
          zip -qry "mizan-${{ steps.v.outputs.name }}-ios-unsigned.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-ios
          path: iosApp/*.ipa
          if-no-files-found: error
