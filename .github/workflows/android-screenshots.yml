name: Android Screenshots

on:
  # يدوي فقط (Actions ← Run workflow): دقائق GitHub Actions محدودة، وبناء macOS يُحسب بعشرة أضعاف
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # المحاكي يحتاج مساحة كبيرة: نحذف أدوات غير مستخدمة من جهاز البناء
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL             /usr/local/lib/android/sdk/ndk /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 3000M
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-app/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mizan-screenshots
          path: |
            screenshots/*.png
            screenshots/*.txt
            screenshots/*.xml
          if-no-files-found: error
