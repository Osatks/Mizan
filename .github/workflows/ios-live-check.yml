name: iOS Live Check (Action Button and controls on the simulator)

# يفحص أزرار الأنشطة الحية كما تعمل على الجهاز: التطبيق الحقيقي (بإطار Kotlin للمحاكي) يُشغَّل بلا واجهة
# (-mizan.live_check، كما يعمل في الخلفية لنية زر الإجراء) فيُنفَّذ كل زر: المسبحة والأذكار والعدّ التنازلي للصلاة،
# من مسار زر الإجراء ومن مسار أزرار مركز التحكم. ثم يُنهى التطبيق وتُلتقط الشاشة الرئيسية بالجزيرة الديناميكية،
# ويُقرأ live-check.json (النتيجة وخطوات التنفيذ وحال الأنشطة). يفشل إن لم يصر النشاط المطلوب ظاهراً.
on:
  workflow_dispatch:
    inputs:
      framework_run:
        description: "Reuse shared-framework-simulator from this earlier run (ios-screenshots or ios-live-check run id); empty builds it"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  framework:
    if: ${{ inputs.framework_run == '' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build Kotlin framework (iosSimulatorArm64)
        working-directory: android-app
        run: |
          x16=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' 2>/dev/null | sort -V | tail -n1)
          if [ -n "$x16" ]; then export DEVELOPER_DIR="$x16/Contents/Developer"; echo "Kotlin link with $x16"; fi
          gradle :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Pack framework
        run: tar -czf "$RUNNER_TEMP/shared-framework-sim.tgz" -C android-app/shared/build/bin/iosSimulatorArm64/releaseFramework Shared.framework
      - uses: actions/upload-artifact@v4
        with:
          name: shared-framework-simulator
          path: ${{ runner.temp }}/shared-framework-sim.tgz
          if-no-files-found: error
          retention-days: 3

  check:
    needs: [framework]
    if: ${{ always() && (needs.framework.result == 'success' || needs.framework.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUNDLE: com.mizan.almuslim
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 27.1
        run: |
          x=/Applications/Xcode_27.1.app/Contents/Developer
          if [ -d "$x" ]; then export DEVELOPER_DIR="$x"; echo "DEVELOPER_DIR=$x" >> "$GITHUB_ENV"; fi
          xcodebuild -version

      - uses: actions/download-artifact@v4
        if: ${{ inputs.framework_run == '' }}
        with:
          name: shared-framework-simulator
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.framework_run != '' }}
        with:
          name: shared-framework-simulator
          path: ${{ runner.temp }}
          run-id: ${{ inputs.framework_run }}
          github-token: ${{ github.token }}

      - name: Use the simulator framework
        run: |
          dst=android-app/shared/build/bin/iosArm64/releaseFramework
          rm -rf "$dst" && mkdir -p "$dst"
          tar -xzf "$RUNNER_TEMP/shared-framework-sim.tgz" -C "$dst"
          test -f "$dst/Shared.framework/Shared"

      - name: Build app (simulator)
        working-directory: iosApp
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Mizan.xcodeproj -scheme Mizan -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 40
          APP=build/Build/Products/Release-iphonesimulator/Mizan.app
          test -d "$APP"
          for f in "$APP"/Frameworks/*.framework; do [ -d "$f" ] && codesign --force --sign - --timestamp=none "$f"; done
          codesign --force --sign - --timestamp=none --entitlements MizanWidgets/MizanWidgets.entitlements "$APP/PlugIns/MizanWidgets.appex"
          for x in "$APP"/Watch/*.app/PlugIns/*.appex; do [ -d "$x" ] && codesign --force --sign - --timestamp=none --entitlements MizanWatchWidgets/MizanWatchWidgets.entitlements "$x"; done
          for x in "$APP"/Watch/*.app; do [ -d "$x" ] && codesign --force --sign - --timestamp=none --entitlements MizanWatch/MizanWatch.entitlements "$x"; done
          codesign --force --sign - --timestamp=none --entitlements iosApp/Mizan.entitlements "$APP"

      - name: Simulator (iPhone with a Dynamic Island)
        id: sim
        run: |
          rt=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]; rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")]); print(rs[-1]["identifier"])')
          udid=$(xcrun simctl create "Live Check" "iPhone 17 Pro Max" "$rt")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" || true
          xcrun simctl install "$udid" iosApp/build/Build/Products/Release-iphonesimulator/Mizan.app
          # تشغيل أول عادي (يفتح الواجهة) كما يفعل المستخدم بعد التثبيت، ثم إنهاؤه
          xcrun simctl launch "$udid" "$BUNDLE" -mizan.onboarded YES -mizan.lang ar \
            -mizan.place_key amman -mizan.place_lat 31.9454 -mizan.place_lng 35.9284 -mizan.place_tz Asia/Amman \
            -mizan.place_method jordan -mizan.place_gps NO -mizan.method jordan >/dev/null
          sleep 12
          xcrun simctl terminate "$udid" "$BUNDLE" || true
          sleep 2

      - name: Run the buttons
        id: run
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          out="$RUNNER_TEMP/live-check"; mkdir -p "$out"
          fail=0
          for action in prayer adhkar adhkar tasbih tasbih prayerControl adhkarControl tasbihControl; do
            n=$(ls "$out" | grep -c "^$action-" || true); name="$action-$((n+1))"
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            sleep 1
            # بلا واجهة: الوسيط -mizan.live_check يجعل التطبيق ينفّذ الزر ويكتب النتيجة (LiveCheck.swift)
            xcrun simctl launch "$UDID" "$BUNDLE" -mizan.live_check "$action" -mizan.onboarded YES -mizan.lang ar \
              -mizan.place_key amman -mizan.place_lat 31.9454 -mizan.place_lng 35.9284 -mizan.place_tz Asia/Amman \
              -mizan.place_method jordan -mizan.place_gps NO -mizan.method jordan >/dev/null
            sleep 7
            data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
            if [ -f "$data/Documents/live-check.json" ]; then
              cp "$data/Documents/live-check.json" "$out/$name.json"; rm -f "$data/Documents/live-check.json"
            else
              echo '{"error":"no result file (the app did not reach LiveCheck.run, or crashed)"}' > "$out/$name.json"
            fi
            # التطبيق يُنهى فتبقى الأنشطة في الجزيرة على الشاشة الرئيسية
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            sleep 3
            xcrun simctl io "$UDID" screenshot --type=png "$out/$name.png" >/dev/null
            echo "== $name"; cat "$out/$name.json"; echo
            python3 - "$out/$name.json" "$action" <<'PY' || fail=1
          import json, sys
          r = json.load(open(sys.argv[1])); kind = sys.argv[2].replace("Control", "")
          after = r.get("after", [])
          ok = r.get("outcome") == "ok" and any(s.startswith(kind + " active") for s in after)
          print(("OK  " if ok else "FAIL") + f" {sys.argv[2]}: outcome={r.get('outcome')} after={after}")
          sys.exit(0 if ok else 1)
          PY
          done
          # سجل التطبيق (Logger: com.mizan.almuslim) لما جرى
          xcrun simctl spawn "$UDID" log show --last 6m --predicate 'subsystem == "com.mizan.almuslim"' --style compact > "$out/app-log.txt" 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 6m --predicate 'process == "Mizan" AND messageType == error' --style compact > "$out/app-errors.txt" 2>/dev/null || true
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mizan-live-check
          path: ${{ runner.temp }}/live-check
          if-no-files-found: warn
          retention-days: 7

      - name: Result
        if: ${{ steps.run.outputs.fail == '1' }}
        run: |
          echo "::error::a live activity button did not produce a visible activity; see the mizan-live-check artifact"
          exit 1
